    <!-- loading screen: inline so it shows before any JS or CSS arrives;
         src/loading.js fades it out once the hero's first frame and the fonts are in -->
    <style>
      html.is-loading { overflow: hidden; }
      #loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f7faf9; transition: opacity 0.5s ease, visibility 0.5s; }
      #loader.done { opacity: 0; visibility: hidden; }
      /* the content only appears if loading takes a moment, so fast loads never flash it */
      #loader .ld { display: grid; justify-items: center; gap: 18px; opacity: 0; animation: ld-in 0.4s ease 0.3s forwards; }
      #loader .ld-name { font: 300 28px/1 'Newsreader', Georgia, serif; letter-spacing: -0.01em; color: #141517; }
      #loader .ld-bar { position: relative; width: 120px; height: 1px; overflow: hidden; background: #e6e7e9; }
      #loader .ld-bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: #141517; animation: ld-slide 1.1s ease-in-out infinite; }
      @keyframes ld-in { to { opacity: 1; } }
      @keyframes ld-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #loader { transition: none; }
        #loader .ld-bar::after { animation: none; width: 100%; }
      }
    </style>
    <noscript><style>html.is-loading { overflow: auto; } #loader { display: none; }</style></noscript>
